<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata render demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; top: 12px; left: 12px; width: 232px; padding: 10px 12px;
    background: rgba(0,0,0,.72); border: 1px solid #333; max-height: calc(100% - 46px); overflow: auto; }
  .hidden { display: none; }
  #ui h1 { font-size: 11px; font-weight: normal; letter-spacing: .2em; margin: 0 0 8px; }
  #ui h2 { font-size: 10px; font-weight: normal; letter-spacing: .15em; color: #777; margin: 10px 0 2px; }
  label { display: grid; grid-template-columns: 78px 1fr 46px; gap: 6px; align-items: center; }
  label span:last-child { text-align: right; color: #999; }
  input[type=range] { width: 100%; accent-color: #fff; margin: 0; }
  select { grid-column: 2 / 4; background: #000; color: #fff; border: 1px solid #444; font: inherit; }
  #stats { position: fixed; right: 12px; top: 12px; text-align: right; color: #aaa; white-space: pre; }
  #stats b { color: #fff; font-weight: normal; font-size: 22px; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #555; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="stats"></div>
<div id="hint">drag to orbit, wheel to zoom, H hides the panel, space pauses</div>
<div id="msg"></div>
<script type="module" src="./demo.ts"></script>
</body>
</html>
