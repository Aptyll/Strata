<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata depth cues</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; top: 12px; left: 12px; padding: 10px 12px; background: rgba(0,0,0,.6);
    border: 1px solid #333; user-select: none; max-width: 240px; }
  #ui.hidden { display: none; }
  #ui h1 { font-size: 12px; margin: 0 0 6px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  #ui label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #ui label span { flex: 1; color: #aaa; }
  #ui input[type=range] { width: 96px; accent-color: #fff; }
  #ui input[type=checkbox] { accent-color: #fff; margin: 0; }
  #ui hr { border: 0; border-top: 1px solid #333; margin: 6px 0; }
  #hud { color: #888; white-space: pre; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center; color: #aaa; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Depth cues</h1>
  <label><input type="checkbox" id="fog" checked><span>[1] fog into black</span></label>
  <label><input type="checkbox" id="dof" checked><span>[2] depth of field</span></label>
  <label><input type="checkbox" id="atmosphere" checked><span>[3] size and brightness</span></label>
  <label><input type="checkbox" id="parallax" checked><span>[4] parallax</span></label>
  <label><input type="checkbox" id="autofocus" checked><span>[5] focus nearest plane</span></label>
  <hr>
  <label><span>fog reach</span><input type="range" id="fogReach" min="60" max="900" value="200"></label>
  <label><span>aperture</span><input type="range" id="aperture" min="0" max="24" step="0.5" value="7"></label>
  <label><span>focus</span><input type="range" id="focus" min="2" max="300" step="1" value="20"></label>
  <label><span>exposure</span><input type="range" id="exposure" min="-3" max="5" step="0.1" value="0"></label>
  <label><span>speed</span><input type="range" id="speed" min="0" max="20" step="0.5" value="4"></label>
  <label><span>particles</span><input type="range" id="count" min="16" max="24" step="0.5" value="21"></label>
  <hr>
  <div id="hud"></div>
  <div style="color:#666">drag to look, space pauses, H hides</div>
</div>
<div id="err"></div>
<script type="module" src="./demo.ts"></script>
</body>
</html>
