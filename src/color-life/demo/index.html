<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strata color life</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
      #hud {
        position: fixed; left: 12px; bottom: 10px; color: #8a8a8a; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        pointer-events: none; white-space: pre; text-shadow: 0 0 4px #000;
      }
      #rules { position: fixed; left: 12px; top: 12px; display: grid; gap: 2px; pointer-events: none; }
      #rules span { width: 12px; height: 12px; display: block; border-radius: 2px; }
      #rules .dot { border-radius: 50%; transform: scale(0.7); }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="rules"></div>
    <div id="hud"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
