<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strata perf benchmark</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
      body { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #hud { position: fixed; top: 12px; left: 12px; white-space: pre; pointer-events: none; text-shadow: 0 0 4px #000, 0 0 2px #000; }
      #bar { position: fixed; bottom: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
      #bar a, #bar button {
        font: inherit; color: #fff; background: rgba(0, 0, 0, 0.6); border: 1px solid #555;
        padding: 2px 8px; text-decoration: none; cursor: pointer;
      }
      #bar a.on, #bar button.on { background: #fff; color: #000; border-color: #fff; }
      #report { position: fixed; top: 12px; right: 12px; max-width: 60vw; max-height: 90vh; overflow: auto; white-space: pre; background: rgba(0, 0, 0, 0.8); padding: 8px 12px; border: 1px solid #555; display: none; }
      #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="bar"></div>
    <div id="report"></div>
    <div id="error"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
