# Builds the site and publishes it to GitHub Pages on every push to main,
# unless a built page no longer starts: then the live site stays as it is.
# Pages must be set to "GitHub Actions" in Settings > Pages (done 2026-11-19).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run that is already deploying finishes; runs
# queued behind it collapse into the newest one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Deploys wait for each other (the "pages" group above), so a stuck run must not hold the queue.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # base_path is "/Strata" on aptyll.github.io, or "" with a custom domain,
      # so asset URLs stay right either way.
      - name: Build
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"
        env:
          # The site's full public address, for canonical links and link preview images (src/site).
          STRATA_SITE_URL: ${{ steps.pages.outputs.base_url }}/

      # The build also writes the standalone pages in docs/explainers to
      # dist/docs/explainers (src/site/plugin.mjs), so dist is the whole site.

      # Does what we are about to publish still start? Opens every built page
      # headless on a software GPU (scripts/smoke.mjs, the check CI also runs).
      # A page that throws, logs an error or stops drawing fails this job, no
      # artifact is uploaded, and the site keeps showing the last good version.
      # Playwright is not a project dependency, so a pinned copy is installed here.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Boot check on the built site
        run: npm run smoke -- --base="${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
