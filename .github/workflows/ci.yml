# Builds and runs the light tests on every pull request and on every push to
# main, so a merge that breaks the build shows up as a red X within a minute.
#
# This is a safety net, not a gate: nothing here blocks a merge, and threads
# still run `npm ci && npm run build` themselves right before merging.
# A pull request is checked as it would look merged into main at push time,
# which catches two PRs that are each fine alone but break together.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR replaces its older run. Every commit on main keeps its own
# run, so the commit that broke the build is the first one with a red X.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and light tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same command every thread runs before merging: tsc --noEmit + vite build.
      - name: Type check and build
        run: npm run build

      # Every *.test.* file under src/, a few seconds, no GPU.
      - name: Unit tests
        run: npm test

  # The checks that need a browser, on a software GPU (SwiftShader) in headless
  # Chromium. They prove the shaders are valid and the site starts, never how
  # fast anything runs.
  #
  # Shader checks: WGSL is only compiled by the GPU driver at run time, so tsc
  # cannot see a broken shader. npm run verify compiles every production
  # shader and runs the shader correctness cases.
  #
  # Boot check: npm run smoke opens every page of the built site and fails if
  # one throws, logs an error, raises a WebGPU error or stops drawing frames.
  browser:
    name: Shader checks and app boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Playwright is not a project dependency (threads use the one installed
      # in their sandbox), so CI installs a pinned copy just for this job.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Shader checks (npm run verify)
        run: npm run verify

      - name: Build the site
        run: npm run build

      - name: App boot check (npm run smoke)
        run: npm run smoke
