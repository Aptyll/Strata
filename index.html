<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strata</title>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='10' cy='11' r='1.6'/%3E%3Ccircle cx='16' cy='9' r='1.1'/%3E%3Ccircle cx='22' cy='12' r='1.8'/%3E%3Ccircle cx='13' cy='17' r='1.2'/%3E%3Ccircle cx='20' cy='18' r='1.4' opacity='.8'/%3E%3Ccircle cx='9' cy='22' r='1' opacity='.6'/%3E%3Ccircle cx='16' cy='23' r='1.7'/%3E%3Ccircle cx='23' cy='24' r='1' opacity='.7'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      /* First-run title card: fades in over the opening, then gets out of the way. Pure CSS, no input. */
      #title-card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; pointer-events: none; color: #fff; text-align: center; opacity: 0;
        font: 300 13px/1.6 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        animation: title-card 6.5s ease 0.6s forwards; }
      #title-card h1 { margin: 0; font-weight: 200; font-size: clamp(28px, 6vw, 64px); letter-spacing: 0.5em;
        text-indent: 0.5em; text-transform: uppercase; }
      #title-card p { margin: 14px 0 0; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.55; }
      @keyframes title-card { 0% { opacity: 0; } 22% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #title-card { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="title-card" aria-hidden="true"><h1>Strata</h1><p>drag to turn &middot; scroll to dive &middot; R for a new world</p></div>
    <script>
      // Only on the plain first visit: not in Challenge, record, a shared world link or with ?intro=0.
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.has("challenge") || q.has("record") || q.has("world") || q.get("intro") === "0") {
          var el = document.getElementById("title-card");
          if (el) el.remove();
        }
        // Remove it once faded, so it never sits over the HUD.
        setTimeout(function () { var el = document.getElementById("title-card"); if (el) el.remove(); }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
