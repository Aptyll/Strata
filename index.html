<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strata</title>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='10' cy='11' r='1.6'/%3E%3Ccircle cx='16' cy='9' r='1.1'/%3E%3Ccircle cx='22' cy='12' r='1.8'/%3E%3Ccircle cx='13' cy='17' r='1.2'/%3E%3Ccircle cx='20' cy='18' r='1.4' opacity='.8'/%3E%3Ccircle cx='9' cy='22' r='1' opacity='.6'/%3E%3Ccircle cx='16' cy='23' r='1.7'/%3E%3Ccircle cx='23' cy='24' r='1' opacity='.7'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      /* First-run title card: fades in over the opening, then gets out of the way. Pure CSS, no input.
         Styled from the design tokens (src/ux/design, docs/ux/design.md): the title role, a caption, the
         halo, slow fades. The tokens arrive with the script, after this card has started, so each var()
         repeats its token's value; npm test fails if one of them goes stale. */
      #title-card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; pointer-events: none; text-align: center; opacity: 0;
        text-shadow: var(--st-halo, 0 0 6px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.9));
        animation:
          title-in var(--st-slow, 1200ms) var(--st-ease-soft, cubic-bezier(0.4, 0, 0.6, 1)) 0.6s forwards,
          title-out var(--st-slow, 1200ms) var(--st-ease-soft, cubic-bezier(0.4, 0, 0.6, 1)) 5.4s forwards; }
      #title-card h1 { margin: 0; text-transform: uppercase;
        font: var(--st-font-title, 200 clamp(28px, 6vw, 64px)/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
        letter-spacing: var(--st-track-title, 0.5em); text-indent: var(--st-track-title, 0.5em);
        color: var(--st-strong, rgba(255, 255, 255, 0.9)); }
      #title-card p { margin: var(--st-space-4, 16px) 0 0; text-transform: uppercase;
        font: var(--st-font-caption, 400 11px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
        letter-spacing: var(--st-track-wide, 0.3em); text-indent: var(--st-track-wide, 0.3em);
        color: var(--st-dim, rgba(255, 255, 255, 0.65)); }
      @keyframes title-in { to { opacity: 1; } }
      @keyframes title-out { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #title-card { animation-duration: var(--st-fast, 180ms), var(--st-fast, 180ms); } }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="title-card" aria-hidden="true"><h1>Strata</h1><p>drag to turn &middot; scroll to dive &middot; R for a new world</p></div>
    <script>
      // Only on the plain first visit: not in Challenge, record, a shared world link or with ?intro=0.
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.has("challenge") || q.has("record") || q.has("world") || q.get("intro") === "0") {
          var el = document.getElementById("title-card");
          if (el) el.remove();
        }
        // Remove it once faded, so it never sits over the HUD.
        setTimeout(function () { var el = document.getElementById("title-card"); if (el) el.remove(); }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
